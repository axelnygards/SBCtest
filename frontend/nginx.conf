server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml;
  gzip_min_length 1024;
  gzip_proxied any;
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header X-Real-IP $remote_addr;   # per-IP solve limit in the backend
    proxy_read_timeout 90s;   # solver: max 30 s + process grace
  }
  # hashed build assets never change -> cache forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # the page itself must always be revalidated, or browsers keep showing an old version
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
